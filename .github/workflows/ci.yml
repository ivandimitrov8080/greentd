# CI (`found-007`).
#
# Four properties, each here because it has been broken at least once, and each
# in the job that can state it most cheaply:
#
#   1. `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings`,
#      `cargo test` -- the code is formatted, has no standing warnings, and its
#      tests pass. `-D warnings` is the point: the tree carried 16 of them
#      until `found-007` dealt with them, and a warning that is allowed to
#      accumulate is a warning nobody reads.
#   2. `cargo build --release` links, on the profile that ships, with
#      `lto = "thin"` and `codegen-units = 1`. A debug build does not prove
#      that.
#   3. A headless server boots with no display, reaches the listening state,
#      steps a wave and dies on SIGTERM (`ci/smoke-server.sh`). This is the job
#      that makes `found-001` a permanent property rather than a thing that was
#      true once.
#   4. A corrupted balance table aborts startup and names the field
#      (`ci/check-balance-refusal.sh`), so `found-004`'s validation cannot rot
#      into a silent `Default::default()`.
#
# Deliberately absent: `paths-ignore` for documentation. A docs-only commit --
# this directory's own files included -- runs the pipeline and passes because
# the code did not change. Skipping it instead would leave a required check
# permanently "Expected" on such a commit, which is a worse failure mode than
# spending the minutes.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are neither cached nor reusable between CI runs, and
  # writing them costs more than it saves on a fresh runner.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: format, lints, tests
    # Pinned rather than `ubuntu-latest`: the system packages below are named
    # for this release, and a runner image bump should be a commit with a
    # reason, not a red build on an unrelated pull request.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # What the build actually links on Linux, from `ldd` on the Nix build:
      # libasound (bevy_audio -> cpal), libudev (bevy_gilrs), libwayland-client
      # (bevy_winit). libxkbcommon is included by Bevy's own CI; it costs
      # nothing and removes a trap if the winit feature set changes.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # `rust-toolchain.toml` selects the channel, and rustup installs it on
      # first use. These lines are also the record of *which* compiler CI got:
      # the Nix devshell supplies 1.97.1 from nixpkgs and ignores that file, so
      # if the two ever drift apart, this is where it shows.
      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  smoke:
    name: headless server and balance validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The scripts take `target/debug/greentd` by default, so this is the one
      # build both steps share.
      - name: Build
        run: cargo build

      - name: Headless smoke run
        run: ./ci/smoke-server.sh

      - name: Balance validation refuses a bad table
        run: ./ci/check-balance-refusal.sh

  release:
    name: release build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          # A distinct cache: mixing release and debug artefacts under one key
          # makes both slower.
          key: release

      - name: Build
        run: cargo build --release
