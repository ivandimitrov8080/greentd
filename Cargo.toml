[package]
name = "greentd"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
# Server-authoritative multiplayer. `udp` + `raw_connection` give us plain
# UDP sockets without the netcode.io connect-token handshake, which is what we
# want for LAN/dev play. prediction/interpolation are deliberately OFF: clients
# are dumb renderers of authoritative state, which is the correct model for a TD.
lightyear = { version = "0.29", default-features = false, features = [
    "std",
    "client",
    "server",
    "replication",
    "udp",
    "raw_connection",
] }
serde = { version = "1", features = ["derive"] }
# Balance tables (assets/balance/*.ron) and the ServerNotice round-trip test.
# Already in the lock file as a transitive dependency of the engine.
ron = "0.12"

# It will disable detailed log levels on compile time so that they do not need to be filtered out while your app is running.
# log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
# When releasing for web, you can pass --profile wasm-release to cargo instead of --release.
